<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run Settlement Screen Mockup</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070808;
      --black: #0b0d0e;
      --panel: rgba(13, 16, 18, 0.92);
      --panel-2: rgba(18, 22, 25, 0.9);
      --line: #4b3d2b;
      --line-soft: rgba(166, 131, 76, 0.28);
      --gold: #d9bd7b;
      --gold-bright: #ffe0a0;
      --text: #e8dfcf;
      --muted: #a79b86;
      --dim: #6f675a;
      --danger: #a6433a;
      --blue-panel: rgba(22, 31, 42, 0.88);
      --green-panel: rgba(34, 63, 45, 0.86);
      --button: rgba(33, 32, 29, 0.92);
      font-family: "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 18%, rgba(140, 110, 56, 0.18), transparent 30%),
        radial-gradient(circle at 75% 40%, rgba(29, 55, 71, 0.18), transparent 42%),
        linear-gradient(135deg, #080909 0%, #101311 48%, #060707 100%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.35;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-width: 1120px;
      min-height: 640px;
      padding: 26px 22px 24px;
      display: grid;
      grid-template-columns: minmax(360px, 27.5vw) 1fr;
      gap: 16px;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.52), transparent 32%, rgba(0,0,0,0.18)),
        radial-gradient(circle at 14% 54%, rgba(213, 174, 98, 0.11), transparent 25%);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(180, 140, 78, 0.36);
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.8), inset 0 0 44px rgba(0,0,0,0.78);
    }

    .side {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      padding: 28px 26px 22px;
      border-right: 1px solid var(--line-soft);
      background:
        linear-gradient(180deg, rgba(9, 11, 12, 0.82), rgba(8, 9, 10, 0.96)),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 8px);
      box-shadow: inset -12px 0 28px rgba(0,0,0,0.45);
    }

    .game-title {
      position: relative;
      min-height: 176px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .game-title::before {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border: 1px solid rgba(189, 146, 77, 0.18);
      transform: rotate(45deg);
      box-shadow: inset 0 0 38px rgba(212, 168, 85, 0.07), 0 0 32px rgba(0,0,0,0.5);
    }

    h1 {
      position: relative;
      margin: 0;
      color: #d8c7a4;
      font-family: "Microsoft YaHei UI", "Noto Serif SC", serif;
      font-size: clamp(56px, 5vw, 86px);
      line-height: 1;
      letter-spacing: 0;
      text-shadow:
        0 2px 0 #2a2218,
        0 0 22px rgba(225, 190, 114, 0.28),
        0 9px 12px rgba(0,0,0,0.9);
    }

    .score-area {
      margin-top: 30px;
      text-align: center;
    }

    .score-label,
    .points-label,
    .section-label {
      color: var(--gold);
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    }

    .score-value {
      margin: 8px 0 18px;
      color: var(--gold-bright);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(74px, 7.2vw, 112px);
      line-height: 0.92;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 0 10px rgba(255, 218, 136, 0.48),
        0 4px 0 rgba(79, 55, 27, 0.72),
        0 14px 20px rgba(0,0,0,0.82);
    }

    .points-box {
      display: inline-grid;
      grid-template-columns: auto auto;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 180px;
      padding: 10px 22px 8px;
      border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
    }

    .gem {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, #f3dbff, transparent 17%),
        radial-gradient(circle at 60% 70%, #3b125f, #8f58c7 45%, #20112f 72%);
      border: 1px solid #b998e8;
      box-shadow: 0 0 12px rgba(141, 83, 199, 0.72);
    }

    .points-value {
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      line-height: 1;
      font-weight: 700;
      text-shadow: 0 3px 8px rgba(0,0,0,0.78);
    }

    .points-rule {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .boss-status {
      position: relative;
      display: grid;
      grid-template-columns: 86px 1fr;
      align-items: center;
      min-height: 86px;
      margin: 34px 0 18px;
      padding: 10px 20px 10px 72px;
      color: #d5ccbd;
      background:
        linear-gradient(90deg, rgba(36, 43, 49, 0.92), rgba(18, 24, 30, 0.78)),
        linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
      border: 1px solid rgba(145, 111, 64, 0.38);
      box-shadow: inset 0 0 22px rgba(0,0,0,0.52), 0 8px 18px rgba(0,0,0,0.4);
    }

    .skull {
      position: absolute;
      left: -8px;
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      color: #d7c6a3;
      font-size: 50px;
      background:
        radial-gradient(circle, rgba(194, 158, 91, 0.2), rgba(13, 14, 15, 0.96) 64%);
      border: 1px solid rgba(167, 128, 67, 0.45);
      clip-path: polygon(50% 0, 92% 22%, 92% 76%, 50% 100%, 8% 76%, 8% 22%);
      text-shadow: 0 5px 10px rgba(0,0,0,0.85);
    }

    .boss-status-text {
      grid-column: 2;
      font-size: clamp(21px, 1.8vw, 30px);
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .calamity-panel {
      align-self: end;
      min-height: 210px;
      padding: 18px 18px 16px;
      border: 1px solid rgba(116, 152, 92, 0.5);
      background:
        linear-gradient(145deg, rgba(40, 68, 48, 0.94), rgba(16, 27, 23, 0.96)),
        radial-gradient(circle at 12% 20%, rgba(157, 210, 121, 0.18), transparent 45%);
      box-shadow: inset 0 0 36px rgba(0,0,0,0.56), 0 12px 28px rgba(0,0,0,0.3);
    }

    .calamity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(191, 218, 166, 0.18);
    }

    .calamity-title {
      color: #dce8cb;
      font-size: 22px;
      font-weight: 800;
    }

    .calamity-state {
      color: #9fcf8e;
      font-size: 13px;
    }

    .calamity-value {
      margin: 18px 0 10px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      color: #f1ffe0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 78px;
      line-height: 0.95;
      font-weight: 800;
      text-shadow: 0 0 18px rgba(143, 216, 106, 0.3), 0 8px 12px rgba(0,0,0,0.6);
    }

    .calamity-value span {
      color: #9fcf8e;
      font-family: inherit;
      font-size: 24px;
    }

    .calamity-note {
      margin: 0;
      color: #bacdae;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .side-actions {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    button {
      height: 50px;
      min-width: 210px;
      padding: 0 26px;
      color: #cfc3ad;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0;
      background:
        linear-gradient(180deg, rgba(61, 54, 43, 0.94), rgba(23, 23, 22, 0.98));
      border: 1px solid rgba(169, 129, 69, 0.58);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.9), 0 5px 14px rgba(0,0,0,0.42);
      cursor: pointer;
    }

    button:hover {
      color: #fff1c4;
      border-color: rgba(237, 198, 117, 0.9);
      background: linear-gradient(180deg, rgba(83, 68, 43, 0.96), rgba(31, 28, 24, 0.98));
    }

    .stats-stage {
      position: relative;
      z-index: 1;
      min-width: 0;
      padding: 20px 20px 22px;
      background:
        linear-gradient(180deg, rgba(11, 13, 15, 0.78), rgba(8, 9, 10, 0.92)),
        radial-gradient(circle at 60% 14%, rgba(62, 91, 119, 0.16), transparent 48%);
      border-left: 1px solid rgba(168, 130, 75, 0.28);
    }

    .stats-frame {
      height: 100%;
      padding: 24px 26px;
      border: 1px solid rgba(76, 97, 123, 0.64);
      background:
        linear-gradient(145deg, var(--blue-panel), rgba(13, 19, 26, 0.96)),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 8px);
      box-shadow: inset 0 0 42px rgba(0,0,0,0.62), 0 18px 50px rgba(0,0,0,0.36);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 18px;
    }

    .stats-top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(158, 178, 200, 0.22);
    }

    .stats-title {
      margin: 0;
      color: #efe5d3;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 3px 8px rgba(0,0,0,0.8);
    }

    .run-time {
      color: #bcc9d5;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-card {
      min-height: 94px;
      padding: 14px;
      border: 1px solid rgba(164, 188, 210, 0.22);
      background: rgba(7, 10, 14, 0.46);
      box-shadow: inset 0 0 16px rgba(0,0,0,0.28);
    }

    .summary-card .label,
    .stat .label {
      color: #aebccc;
      font-size: 14px;
      line-height: 1.35;
    }

    .summary-card .value {
      margin-top: 8px;
      color: #f2e6d4;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .stats-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      grid-template-rows: auto 1fr 1fr 1fr;
      gap: 12px;
    }

    .stat {
      min-width: 0;
      min-height: 112px;
      padding: 16px;
      border: 1px solid rgba(164, 188, 210, 0.2);
      background:
        linear-gradient(180deg, rgba(31, 41, 52, 0.72), rgba(9, 13, 17, 0.72));
      box-shadow: inset 0 0 18px rgba(0,0,0,0.38);
      display: grid;
      align-content: space-between;
      gap: 12px;
    }

    .stat.bands {
      grid-row: span 2;
    }

    .stat .value {
      color: #f0e7d9;
      font-size: 30px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .stat .value small {
      color: #8fa2b5;
      font-size: 14px;
      font-weight: 600;
      margin-left: 6px;
    }

    .band-list {
      display: grid;
      gap: 8px;
    }

    .band-row {
      display: grid;
      grid-template-columns: 54px 1fr 42px;
      align-items: center;
      gap: 10px;
      color: #c7d1dd;
      font-size: 14px;
    }

    .bar {
      height: 9px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #987444, #e6be72);
    }

    .wide {
      grid-column: span 2;
    }

    body.failed .score-value {
      color: #e2c28f;
    }

    body.failed .boss-status {
      background: linear-gradient(90deg, rgba(54, 37, 37, 0.92), rgba(23, 20, 23, 0.82));
    }

    body.failed .calamity-panel {
      border-color: rgba(122, 78, 71, 0.58);
      background:
        linear-gradient(145deg, rgba(73, 38, 37, 0.94), rgba(24, 18, 20, 0.96)),
        radial-gradient(circle at 12% 20%, rgba(212, 91, 81, 0.18), transparent 45%);
    }

    body.failed .calamity-state,
    body.failed .calamity-value span,
    body.failed .calamity-note {
      color: #d49b91;
    }

    @media (max-width: 1120px), (max-height: 640px) {
      body {
        overflow: auto;
      }

      .screen {
        min-width: 0;
        min-height: 0;
        height: auto;
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .side {
        min-height: auto;
        grid-template-rows: auto;
        gap: 14px;
        border-right: 0;
      }

      .game-title {
        min-height: 112px;
      }

      .game-title::before {
        width: 142px;
        height: 142px;
      }

      h1 {
        font-size: 48px;
      }

      .score-area {
        margin-top: 4px;
      }

      .boss-status {
        margin: 12px 0;
      }

      .calamity-panel {
        min-height: 150px;
      }

      .stats-stage {
        padding: 0;
      }

      .stats-frame {
        overflow: visible;
      }

      .stats-summary,
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .stat.bands,
      .wide {
        grid-column: 1 / -1;
      }

      .side-actions {
        justify-content: stretch;
      }

      button {
        width: 100%;
      }
    }

    @media (max-width: 620px) {
      .stats-summary,
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .stats-top {
        align-items: start;
        flex-direction: column;
      }

      .boss-status {
        grid-template-columns: 1fr;
        padding-left: 88px;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <aside class="side">
      <section class="game-title" aria-label="结算标题">
        <h1 id="resultTitle">骰掷大陆</h1>
      </section>

      <section class="score-area" aria-label="最终得分">
        <div class="score-label">总得分</div>
        <div class="score-value" id="scoreValue">128,750</div>
        <div class="points-label">获得能力点</div>
        <div class="points-box">
          <span class="gem" aria-hidden="true"></span>
          <span class="points-value" id="gainedPoints">128</span>
        </div>
        <div class="points-rule">每 1000 分可获得 1 能力点</div>
      </section>

      <section class="boss-status" aria-label="最终威胁状态">
        <div class="skull" aria-hidden="true">☠</div>
        <div class="boss-status-text" id="bossStatus">未能击败最终威胁</div>
      </section>

      <section class="calamity-panel" aria-label="结算灾厄等级">
        <div class="calamity-header">
          <div class="calamity-title">灾厄等级</div>
          <div class="calamity-state" id="calamityState">未通关不计分</div>
        </div>
        <div class="calamity-value"><span>Lv.</span><strong id="calamityTier">4</strong></div>
        <p class="calamity-note" id="calamityNote">失败结算仍展示最终等级，但该项目不会加入总分。</p>
      </section>

      <nav class="side-actions" aria-label="结算操作">
        <button type="button">返回主菜单</button>
      </nav>
    </aside>

    <section class="stats-stage" aria-label="统计区域">
      <div class="stats-frame">
        <header class="stats-top">
          <div>
            <div class="section-label">结算详情</div>
            <h2 class="stats-title">本局统计信息</h2>
          </div>
          <div class="run-time" id="runTime">游戏时长 18:06</div>
        </header>

        <section class="stats-summary" aria-label="核心统计">
          <div class="summary-card">
            <div class="label">本局走过的未探索格子</div>
            <div class="value" id="unexploredTiles">16</div>
          </div>
          <div class="summary-card">
            <div class="label">总金币获取量</div>
            <div class="value" id="moneyGained">690</div>
          </div>
          <div class="summary-card">
            <div class="label">队伍人数</div>
            <div class="value" id="partySize">3</div>
          </div>
          <div class="summary-card">
            <div class="label">结算时遗物数量</div>
            <div class="value" id="relics">4</div>
          </div>
        </section>

        <section class="stats-grid" aria-label="详细统计">
          <article class="stat bands">
            <div class="label">通过普通战斗格子数量</div>
            <div class="band-list">
              <div class="band-row"><span>外层</span><span class="bar"><i id="normalOuterBar" style="width:80%"></i></span><strong id="normalOuter">4</strong></div>
              <div class="band-row"><span>中层</span><span class="bar"><i id="normalMidBar" style="width:40%"></i></span><strong id="normalMid">2</strong></div>
              <div class="band-row"><span>内层</span><span class="bar"><i id="normalInnerBar" style="width:20%"></i></span><strong id="normalInner">1</strong></div>
              <div class="band-row"><span>核心</span><span class="bar"><i id="normalCoreBar" style="width:0%"></i></span><strong id="normalCore">0</strong></div>
            </div>
          </article>

          <article class="stat bands">
            <div class="label">通过精英战斗格子数量</div>
            <div class="band-list">
              <div class="band-row"><span>外层</span><span class="bar"><i id="eliteOuterBar" style="width:50%"></i></span><strong id="eliteOuter">1</strong></div>
              <div class="band-row"><span>中层</span><span class="bar"><i id="eliteMidBar" style="width:50%"></i></span><strong id="eliteMid">1</strong></div>
              <div class="band-row"><span>内层</span><span class="bar"><i id="eliteInnerBar" style="width:0%"></i></span><strong id="eliteInner">0</strong></div>
              <div class="band-row"><span>核心</span><span class="bar"><i id="eliteCoreBar" style="width:0%"></i></span><strong id="eliteCore">0</strong></div>
            </div>
          </article>

          <article class="stat">
            <div class="label">通关特殊副本数量</div>
            <div class="value"><span id="specialDungeons">1</span><small>右出口</small></div>
          </article>

          <article class="stat">
            <div class="label">武器打造数量</div>
            <div class="value"><span id="craftedWeapons">2</span><small>把</small></div>
          </article>

          <article class="stat">
            <div class="label">事件格子通过数量</div>
            <div class="value"><span id="eventsCompleted">3</span><small>完成</small></div>
          </article>

          <article class="stat">
            <div class="label">事件战斗通过数量</div>
            <div class="value"><span id="eventBattles">1</span><small>胜利</small></div>
          </article>

          <article class="stat">
            <div class="label">获得钥匙数量</div>
            <div class="value"><span id="keys">1</span><small>把</small></div>
          </article>

          <article class="stat">
            <div class="label">通过 BOSS 数量</div>
            <div class="value"><span id="bosses">0</span><small id="bossNote">未击败</small></div>
          </article>
        </section>
      </div>
    </section>
  </main>

  <script>
    const data = {
      failed: {
        bodyClass: "failed",
        score: "128,750",
        gained: "128",
        bossStatus: "未能击败最终威胁",
        calamityState: "未通关不计分",
        calamityTier: "4",
        calamityNote: "失败结算仍展示最终等级，但该项目不会加入总分。",
        runTime: "游戏时长 18:06",
        summary: {
          unexploredTiles: "16",
          moneyGained: "690",
          partySize: "3",
          relics: "4"
        },
        normal: [4, 2, 1, 0],
        elite: [1, 1, 0, 0],
        values: {
          specialDungeons: "1",
          craftedWeapons: "2",
          eventsCompleted: "3",
          eventBattles: "1",
          keys: "1",
          bosses: "0",
          bossNote: "未击败"
        }
      },
      cleared: {
        bodyClass: "",
        score: "286,420",
        gained: "286",
        bossStatus: "已击败最终威胁",
        calamityState: "通关计分",
        calamityTier: "6",
        calamityNote: "通关时灾厄等级会根据规则加入最终总分。",
        runTime: "游戏时长 42:18",
        summary: {
          unexploredTiles: "31",
          moneyGained: "1,860",
          partySize: "4",
          relics: "9"
        },
        normal: [5, 4, 3, 1],
        elite: [2, 2, 1, 1],
        values: {
          specialDungeons: "2",
          craftedWeapons: "6",
          eventsCompleted: "5",
          eventBattles: "2",
          keys: "3",
          bosses: "1",
          bossNote: "击杀"
        }
      }
    };

    const summaryIds = ["unexploredTiles", "moneyGained", "partySize", "relics"];
    const valueIds = ["specialDungeons", "craftedWeapons", "eventsCompleted", "eventBattles", "keys", "bosses", "bossNote"];
    const normalIds = ["normalOuter", "normalMid", "normalInner", "normalCore"];
    const eliteIds = ["eliteOuter", "eliteMid", "eliteInner", "eliteCore"];

    function setBandValues(ids, values) {
      const max = Math.max(1, ...values);
      ids.forEach((id, index) => {
        const value = values[index];
        document.getElementById(id).textContent = value;
        document.getElementById(`${id}Bar`).style.width = `${Math.round((value / max) * 100)}%`;
      });
    }

    function applyState(kind) {
      const state = data[kind];
      document.body.className = state.bodyClass;
      document.getElementById("scoreValue").textContent = state.score;
      document.getElementById("gainedPoints").textContent = state.gained;
      document.getElementById("bossStatus").textContent = state.bossStatus;
      document.getElementById("calamityState").textContent = state.calamityState;
      document.getElementById("calamityTier").textContent = state.calamityTier;
      document.getElementById("calamityNote").textContent = state.calamityNote;
      document.getElementById("runTime").textContent = state.runTime;
      summaryIds.forEach((id) => document.getElementById(id).textContent = state.summary[id]);
      valueIds.forEach((id) => document.getElementById(id).textContent = state.values[id]);
      setBandValues(normalIds, state.normal);
      setBandValues(eliteIds, state.elite);
    }
  </script>
</body>
</html>
