<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>枯根撕裂 · 分解特效预览</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#213b30;background:#f2f3eb;font-size:14px;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:34px 24px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:2px;color:#74856b}h1{font-family:Georgia,"Microsoft YaHei",serif;font-size:36px;letter-spacing:3px;margin:8px 0}header p{color:#6e7b65;margin:0;line-height:1.8}.spec{white-space:nowrap;padding:9px 13px;border:1px solid #d0d8c6;border-radius:30px;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.stage{border-radius:14px;overflow:hidden;background:#0b1812;position:relative;box-shadow:0 15px 40px #1c36261a}.stage.light{background:#eee9dc}.stage.checker{background-color:#d2d7cd;background-image:linear-gradient(45deg,#bfc8b9 25%,transparent 25%),linear-gradient(-45deg,#bfc8b9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bfc8b9 75%),linear-gradient(-45deg,transparent 75%,#bfc8b9 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}#stage{display:block;width:100%;height:auto;aspect-ratio:720/500}.stage-top{position:absolute;inset:16px 18px auto;display:flex;justify-content:space-between;color:#c4d2ab;font-size:11px;pointer-events:none}.light .stage-top,.checker .stage-top{color:#4d6248}aside{background:#fcfcf6;border:1px solid #dce2d2;border-radius:14px;padding:20px}label,.label{display:block;color:#6f7d63;font-size:12px;margin:0 0 9px}.control{margin-bottom:22px}button,select{font:inherit;color:inherit;border:1px solid #cfd9c6;border-radius:6px;background:#fcfcf5;min-height:40px;padding:8px 12px;cursor:pointer}button:hover{background:#e5eddd}button.active,button.primary{background:#395c43;color:#fff;border-color:#395c43}.row{display:flex;gap:7px}.row>*{flex:1}.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}.modes button{padding:7px;font-size:12px}select{width:100%}input[type=range]{width:100%;accent-color:#507a45}input[type=checkbox]{accent-color:#507a45}.value{float:right;font-variant-numeric:tabular-nums;font-size:11px}.note{font-size:12px;line-height:1.9;color:#7d876f;border-top:1px solid #e0e6d7;padding-top:15px;margin-bottom:0}.timeline{margin-top:13px;display:flex;align-items:center;gap:14px}#frame-label{min-width:70px;font-size:12px;color:#65745b;font-variant-numeric:tabular-nums}.strip-title{display:flex;justify-content:space-between;align-items:center;margin:30px 0 12px}.strip-title h2{font-size:15px;margin:0}.strip-title span{font-size:11px;color:#7e8b72}.frames{display:grid;grid-template-columns:repeat(var(--frame-columns,16),minmax(0,1fr));gap:5px}.frame{padding:0;min-width:0;overflow:hidden;border-radius:7px;background:#102017;border-color:#344b38;color:#b9c8a0}.frame canvas{display:block;width:100%;height:auto;aspect-ratio:1}.frame small{display:block;font-size:10px;padding-bottom:5px}.frame.selected{outline:2px solid #85a85d;outline-offset:1px}.frame:hover{background:#1b3021}footer{margin-top:20px;display:flex;justify-content:space-between;gap:16px;color:#818c75;font-size:11px;line-height:1.8}a{color:#547448}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #95b16e;outline-offset:3px}@media(max-width:760px){main{padding:22px 14px}.workspace{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}.control{margin:0}.note{grid-column:1/-1}header{align-items:start}header p{font-size:12px}h1{font-size:29px}.spec{font-size:10px;padding:7px}.frames{grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}footer{flex-wrap:wrap}}
@media(max-width:760px){header{flex-wrap:wrap;gap:12px}}
</style>
<main>
<header><div><div class="eyebrow">DICELAND / ENEMY VFX · SAMPLE 01</div><h1>枯根撕裂</h1><p>044 枯枝王庭 · 分解命中特效<br>根痕划开，腐叶与毒绿色流光随之散去。</p></div><span class="spec" id="spec">动画信息</span></header>
<section class="workspace">
<div><div class="stage" id="surface"><div class="stage-top"><span id="mode-label">透明命中特效</span><span id="phase-label">起势</span></div><canvas id="stage" width="720" height="500" aria-label="枯根撕裂动画预览"></canvas></div><div class="timeline"><input id="timeline" type="range" min="0" max="15" step="1" value="0" aria-label="逐帧进度"><span id="frame-label">01 / 16</span></div></div>
<aside>
<div class="control"><span class="label">播放</span><div class="row"><button id="play" class="primary">暂停</button><button id="restart">重播</button></div></div>
<div class="control"><label for="speed">速度</label><select id="speed"><option value="0.25">四分之一速</option><option value="0.5">半速</option><option value="1" selected>正常速度</option><option value="2">两倍速度</option></select></div>
<div class="control"><span class="label">查看方式</span><div class="modes"><button id="isolated" class="active">纯特效</button><button id="context">施放示意</button></div></div>
<div class="control"><span class="label">背景</span><div class="modes"><button data-bg="dark" class="active">深色</button><button data-bg="light">浅色</button><button data-bg="checker">透明网格</button></div></div>
<div class="control"><label for="scale">特效尺寸 <span class="value" id="scale-value">100%</span></label><input id="scale" type="range" min="60" max="150" value="100" step="5"></div>
<div class="control"><label><input id="loop" type="checkbox" checked> 循环播放</label><div class="row"><button id="prev" aria-label="上一帧">上一帧</button><button id="next" aria-label="下一帧">下一帧</button></div></div>
<p class="note" id="timing-note">分解的两颗攻击骰均使用这套命中特效。施放示意用于观察构图，动画尺寸与节奏可在右侧调整。</p>
</aside></section>
<section><div class="strip-title"><h2>逐帧查看</h2><span>点击一帧，暂停并定位</span></div><div class="frames" id="frames"></div></section>
<footer><span id="source-label">Blender 动画源文件与团结预制体已保存在项目中</span><a id="download" download="044_Decomposition_RootRend_4x4.png">下载透明图集 ↗</a></footer>
</main>
<script id="vfx-data" type="application/json">/*__VFX_DATA__*/</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('vfx-data').textContent),$=id=>document.getElementById(id),canvas=$('stage'),ctx=canvas.getContext('2d');
const load=src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src;});
let sheet,idle,pose,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,elapsed=0,last=0,speed=1,size=1,context=false,frame=0;
const count=data.frames.length,fps=data.fps||32,duration=data.duration||count/fps,cycle=duration+0.6;
$('timeline').max=count-1;$('frames').style.setProperty('--frame-columns',Math.min(count,12));$('spec').textContent=count+' 帧 / '+fps+' FPS / '+duration.toFixed(2)+' 秒';$('source-label').textContent=data.sourceLabel+' · 动画源文件与团结预制体均已保存';$('timing-note').textContent='第 1–'+Math.round(count*.25)+' 帧起势，第 '+(Math.round(count*.25)+1)+'–'+Math.round(count*.58)+' 帧撕裂，其后消散。分解的两颗攻击骰均使用这套命中特效。施放示意用于观察构图，尺寸与节奏可调整。';
function drawFrame(target,index,x,y,width){if(index<0||index===count-1)return;const f=data.frames[index];target.drawImage(sheet,f.x,sheet.height-f.y-f.height,f.width,f.height,x-width/2,y-width/2,width,width);}
function actor(image,x,bottom,height){const width=image.width*height/image.height;ctx.drawImage(image,x-width/2,bottom-height,width,height);}
function render(index){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(context){const light=$('surface').classList.contains('light')||$('surface').classList.contains('checker');ctx.strokeStyle=light?'#a9b899':'#37533a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(55,425);ctx.lineTo(675,425);ctx.stroke();actor(index>=0?pose:idle,555,425,345);ctx.setLineDash([4,7]);ctx.beginPath();ctx.ellipse(225,420,100,17,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=light?'#607951':'#89a16b';ctx.font='12px Microsoft YaHei';ctx.textAlign='center';ctx.fillText('受击位置',225,455);drawFrame(ctx,index,225,280,310*size);}else drawFrame(ctx,index,360,270,360*size);
 const shown=index<0?count-1:index;$('timeline').value=shown;$('frame-label').textContent=String(shown+1).padStart(2,'0')+' / '+count;$('phase-label').textContent=index<0?'余韵':shown<count*.25?'起势':shown<count*.58?'撕裂':'消散';
 for(const button of document.querySelectorAll('.frame'))button.classList.toggle('selected',Number(button.dataset.frame)===shown);
}
function syncPlay(){$('play').textContent=playing?'暂停':'播放';}
function seek(index){playing=false;frame=(index+count)%count;elapsed=frame/fps;syncPlay();if(sheet)render(frame);}
function animate(now){const delta=last?Math.min(0.1,(now-last)/1000):0;last=now;if(playing){elapsed+=delta*speed;if($('loop').checked)elapsed%=cycle;else if(elapsed>=duration){elapsed=duration;playing=false;syncPlay();}frame=elapsed<duration?Math.min(count-1,Math.floor(elapsed*fps)):-1;}render(frame);requestAnimationFrame(animate);}
$('play').onclick=()=>{if(!playing&&elapsed>=duration)elapsed=0;playing=!playing;syncPlay();};$('restart').onclick=()=>{elapsed=0;frame=0;playing=true;syncPlay();};$('prev').onclick=()=>seek((frame<0?count-1:frame)-1);$('next').onclick=()=>seek((frame<0?count-1:frame)+1);$('timeline').oninput=event=>seek(Number(event.target.value));$('speed').onchange=event=>{speed=Number(event.target.value);};$('scale').oninput=event=>{size=Number(event.target.value)/100;$('scale-value').textContent=event.target.value+'%';};
for(const button of document.querySelectorAll('[data-bg]'))button.onclick=()=>{$('surface').className='stage '+(button.dataset.bg==='dark'?'':button.dataset.bg);for(const other of document.querySelectorAll('[data-bg]'))other.classList.toggle('active',other===button);};
function mode(value){context=value;$('context').classList.toggle('active',value);$('isolated').classList.toggle('active',!value);$('mode-label').textContent=value?'分解 · 施放构图示意':'透明命中特效';}
$('isolated').onclick=()=>mode(false);$('context').onclick=()=>mode(true);document.addEventListener('keydown',event=>{if(event.target.matches('input,select'))return;if(event.code==='Space'){event.preventDefault();$('play').click();}if(event.key==='ArrowRight')$('next').click();if(event.key==='ArrowLeft')$('prev').click();});
Promise.all([load(data.atlas),load(data.idle),load(data.pose)]).then(images=>{[sheet,idle,pose]=images;$('download').href=data.atlas;$('download').download=data.atlasName;for(let i=0;i<count;i++){const button=document.createElement('button');button.className='frame';button.dataset.frame=i;button.setAttribute('aria-label','查看第 '+(i+1)+' 帧');button.innerHTML='<canvas width="96" height="96"></canvas><small>'+String(i+1).padStart(2,'0')+'</small>';button.onclick=()=>seek(i);$('frames').append(button);drawFrame(button.querySelector('canvas').getContext('2d'),i,48,48,90);}syncPlay();document.body.dataset.ready='true';requestAnimationFrame(animate);}).catch(()=>{$('phase-label').textContent='图片载入失败';});
</script>
</html>
